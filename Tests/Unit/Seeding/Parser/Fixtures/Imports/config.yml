# The entry file of a set that is split over two files. "Scenarios.yaml"
# contributes one scenario, this file contributes another, and "YamlFileLoader"
# merges the imported list into the importing one instead of replacing it.
identifier: imports-demo
title: 'A set split over two files'

imports:
  - { resource: Scenarios.yaml }

scenarios:
  - Content.yaml
