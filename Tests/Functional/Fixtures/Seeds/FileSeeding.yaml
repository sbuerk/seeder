# The seed set of "FileSeedingTest".
#
# It is a file rather than an array built in the test, because two of the things
# under test only exist for a set that was read from disk: a "source" relative
# to the directory holding the set, and an "EXT:" source next to it.
identifier: file-seeding
title: 'A page tree and the files of its set'

scenarios:
  - FileSeeding/Scenario.yaml

files:
  # Relative to this directory, which is what lets a set be moved or renamed
  # without touching its paths.
  - identifier: landscape
    source: 'Files/placeholder.svg'
    folder: 'seed-files'
  # The other accepted form, resolved by the core rather than against the set.
  - identifier: portrait
    source: 'EXT:data_factory/Tests/Functional/Fixtures/Seeds/Files/placeholder-portrait.svg'
    folder: 'seed-files'
