##
# The same tree as "PageTreeScenario.yaml" plus actions, written by
# "DataHandlerWriterTest": the two TYPO3 Core uses - "delete" and
# "move/toPage" - plus "move/toTop", which has no consumer in Core and is the
# only action whose command map value is a "NEW" identifier, and
# "move/afterRecord", which has no consumer either and is the only one that
# names its target as a negative uid.
#
# Every action targets a record this very scenario creates, which is what makes
# them a statement about ordering: they can only work if every data map was
# written before the first command map was processed.
##
entitySettings:
  '*':
    defaultValues:
      hidden: 0
  page:
    isNode: true
    tableName: 'pages'
    parentColumnName: 'pid'
    defaultValues:
      pid: 0
      doktype: 1
  content:
    tableName: 'tt_content'
    nodeColumnName: 'pid'
    columnNames:
      title: 'header'
    defaultValues:
      CType: 'text'

entities:
  page:
    - self: {id: 100, title: 'Root', slug: '/'}
      entities:
        content:
          - self: {id: 300, title: 'Stays on the root page'}
          - self: {id: 301, title: 'Deleted right after it was written'}
            actions:
              - {action: 'delete'}
          - self: {id: 302, title: 'Moved to a page of this very scenario'}
            actions:
              - {action: 'move', type: 'toPage', target: 110}
          - self: {id: 303, title: 'Moved to the top of its own page'}
            actions:
              - {action: 'move', type: 'toTop'}
          - self: {id: 304, title: 'Moved behind the element that went to the top'}
            actions:
              - {action: 'move', type: 'afterRecord', target: 303}
      children:
        - self: {id: 110, title: 'First child', slug: '/first'}
