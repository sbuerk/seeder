#
# The set "seeder:import" is driven with: a page tree with declared uids, a
# content element, a file, a site configuration - and an "imports" of a file
# next to this one, so the resolution of a relative resource is exercised for a
# set that was discovered rather than handed over by a test.
#
identifier: import-full
title: 'Everything the importer writes'
description: 'Pages, a content element, a file and a site configuration.'

imports:
  - { resource: Files.yaml }

#
# Relative to the directory of this file, which is what lets a set be moved or
# renamed without touching its paths.
#
scenarios:
  - Scenario.yaml

#
# "rootPage" is the uid the scenario declares for the page, not a name: a
# scenario record has no symbolic identifier.
#
sites:
  - identifier: import-main
    rootPage: 11
    template: Sites/main

#
# The file is declared in the imported "Files.yaml" and referenced here, so the
# reference resolves an identifier that another file of the set brought in.
# "pages.media" is a "type => file" column of the shipped core TCA, which keeps
# this set importable by any test loading this extension alone.
#
references:
  - file: placeholder
    table: pages
    uid: 11
    field: media
    values:
      title: 'The placeholder'
      alternative: 'A grey rectangle'
